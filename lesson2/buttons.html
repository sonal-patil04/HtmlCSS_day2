<html>
    <head>
        <title>Buttons</title>

        <style>
        .subscriber-buttton
        {
           background-color: red;
           color: rgb(255,255,255); 
           border: none;
           height: 36px;
           width: 105px;
           border-radius: 2px;
           cursor: pointer;
           margin-right: 8px;
        }


        .join-buttton
        {
           background-color: white;
           border-color: rgb(41,56,78);
           border-style: solid;
           border-width: 1px;
           color: rgb(41,118,211);
           height: 36px;
           width: 62px;
           border-radius: 2px;
           cursor: pointer;
        }

        .tweet-buttton
        {
           background-color: blue;
           color: rgb(255,255,255); 
           border: none;
           height: 36px;
           width: 74px;
           border-radius: 18px;
           font-weight: bold;
           font-size: 15px;
           cursor: pointer;
           margin-left: 8px;
        }
        </style>

    </head>
    <body>
    

        <button class="subscriber-buttton">SUBSCRIBE</button>
        <button class="join-buttton">JOIN</button>
        <button class="tweet-buttton">TWEET</button>


    </body>
</html>
